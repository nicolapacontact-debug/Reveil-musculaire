<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#F5F4EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Réveil musculaire">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Réveil musculaire à la maison</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Concept : une appli de poche en une colonne, 4 onglets en bas. Crème et vert sauge de la marque Nico l'APA, titres en capitales larges comme sur la couverture du PDF, échelle RPE en couleurs comme dans le carnet. */
:root{
  --bg:#F5F4EC; --card:#FDFCF8; --ink:#1E2B1A; --ink-2:#55634F; --line:#DCDECF;
  --sage:#9CC184; --sage-soft:#E3ECD6; --cta:#35591D; --on-cta:#F7F6EE; --link:#35591D;
  --z1:#7DBB63; --z2:#3F7A28; --z3:#F2D14B; --z4:#F08A2E; --z5:#D32F2F;
  --on-z1:#14200F; --on-z2:#FFFFFF; --on-z3:#14200F; --on-z4:#14200F; --on-z5:#FFFFFF;
  --shadow:0 10px 26px -14px rgba(30,43,26,.28);
  --scrim:rgba(20,28,16,.5);
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12170F; --card:#1B2217; --ink:#EDF0E6; --ink-2:#A3B09A; --line:#2D3828;
    --sage:#8DB874; --sage-soft:#243020; --cta:#A9CE8F; --on-cta:#10180C; --link:#A9CE8F;
    --shadow:0 10px 26px -14px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12170F; --card:#1B2217; --ink:#EDF0E6; --ink-2:#A3B09A; --line:#2D3828;
  --sage:#8DB874; --sage-soft:#243020; --cta:#A9CE8F; --on-cta:#10180C; --link:#A9CE8F;
  --shadow:0 10px 26px -14px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 92px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:480px;margin-inline:auto;display:grid;gap:16px;min-width:0}
h1,h2,h3,p{margin:0}
h1{font:700 26px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h2{font:700 19px/1.25 var(--f-body);text-wrap:balance}
h3{font:600 16px/1.3 var(--f-body)}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.eyebrow{font:600 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

/* barre du haut */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:50%;display:block}
.brand{min-width:0;display:grid;gap:3px}
.brand b{font:700 13px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.brand span{display:block;font:500 12px/1.2 var(--f-body);color:var(--ink-2)}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.hero{background:var(--sage-soft);border-radius:20px;padding:20px 18px;display:grid;gap:14px;min-width:0}
.hero h1{font-size:34px}
.stack{display:grid;gap:8px;min-width:0}

/* boutons */
.btn{appearance:none;border:0;background:var(--cta);color:var(--on-cta);font:600 16px/1 var(--f-body);padding:15px 20px;border-radius:999px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink-2)}
.btn.soft{background:var(--sage-soft);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.link-btn{appearance:none;background:none;border:0;padding:6px 0;font:600 15px/1.2 var(--f-body);color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}

/* progression */
.prog{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.prog .wk{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.prog i{display:block;height:9px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--cta)}
.prog i.cur{background:var(--sage)}
.prog-lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-2)}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;border-radius:12px;border:1.5px solid transparent;background:var(--bg);min-width:0}
.day small{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.day b{font:600 15px/1.2 var(--f-body)}
.day .mk{height:18px;display:grid;place-items:center}
.day .dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}
.day.planned{background:var(--sage-soft)}
.day.today{border-color:var(--ink)}
.day.done .mk{background:var(--cta);color:var(--on-cta);border-radius:50%;width:18px}

/* lecteur vidéo */
.player{position:relative;display:block;justify-self:center;width:min(100%,250px);aspect-ratio:9/15.4;border-radius:18px;overflow:hidden;background:var(--line);text-decoration:none;color:#fff}
.player img{width:100%;height:100%;object-fit:cover;display:block}
.player .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to top,rgba(10,16,8,.62),rgba(10,16,8,.05) 55%)}
.player .pbtn{width:64px;height:64px;border-radius:50%;background:rgba(253,252,248,.95);color:#1E2B1A;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.player .cap{position:absolute;left:12px;right:12px;bottom:12px;font:600 14px/1.25 var(--f-body);text-align:center}
.player .playbtn{appearance:none;border:0;padding:0;margin:0;background:none;color:inherit;font:inherit;display:block;width:100%;height:100%;cursor:pointer;position:relative}
.top .gear{margin-left:auto;flex:none;appearance:none;border:0;background:transparent;color:var(--ink-2);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.top .gear:hover{background:var(--sage-soft);color:var(--ink)}
.seg.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.danger{color:var(--z5)}
.hello{font:600 20px/1.2 var(--f-body)}
input.fld{width:100%;min-height:50px;font:400 17px/1.3 var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.dipbox{display:grid;justify-items:center}
.dipbox img{width:min(100%,280px);border-radius:12px;display:block;border:1px solid var(--line)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;width:min(calc(100% - 32px),440px);box-shadow:0 12px 28px -10px rgba(20,28,16,.55)}
.evid{display:grid;min-width:0}
.evbtn{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--sage-soft);color:var(--ink);font:600 15px/1.3 var(--f-body);cursor:pointer;text-decoration:none;min-width:0}
.evbtn small{display:block;font:500 13px/1.3 var(--f-body);color:var(--ink-2)}
.evbtn .pic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--cta);color:var(--on-cta);display:grid;place-items:center}
.evid .frame{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.evid .frame .prev{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:#0F1A0B;color:#fff;text-decoration:none;text-align:center;padding:14px}
.evid .frame .prev .pbtn{width:60px;height:60px;border-radius:50%;background:rgba(253,252,248,.95);color:#1E2B1A;display:grid;place-items:center}
.evid .frame .prev .pcap{font:500 13px/1.35 var(--f-body);max-width:260px}
.evid .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player.wide{width:100%;aspect-ratio:var(--vr);background:#0F1A0B}
.player.wide img{object-fit:contain}
.player.playing{width:100%;aspect-ratio:var(--vr,4/5);background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player.pending img{filter:saturate(.55) brightness(.8)}
.player.pending .pbtn{background:rgba(253,252,248,.85);color:#55634F}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-body);padding:7px 11px;border-radius:999px;background:var(--sage-soft);color:var(--ink)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.chip.z1{background:var(--z1);color:var(--on-z1)}.chip.z2{background:var(--z2);color:var(--on-z2)}
.chip.z3{background:var(--z3);color:var(--on-z3)}.chip.z4{background:var(--z4);color:var(--on-z4)}.chip.z5{background:var(--z5);color:var(--on-z5)}

/* échelle RPE */
fieldset{border:0;margin:0;padding:0;min-width:0;display:grid;gap:8px}
legend{padding:0;font:600 16px/1.3 var(--f-body);margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{appearance:none;font:600 16px/1 var(--f-body);padding:14px 10px;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.rpe{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.rpe button{appearance:none;border:0;border-radius:8px;min-height:48px;font:700 14px/1 var(--f-body);cursor:pointer;padding:0}
.rpe button.z1{background:var(--z1);color:var(--on-z1)}.rpe button.z2{background:var(--z2);color:var(--on-z2)}
.rpe button.z3{background:var(--z3);color:var(--on-z3)}.rpe button.z4{background:var(--z4);color:var(--on-z4)}.rpe button.z5{background:var(--z5);color:var(--on-z5)}
.rpe button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px;transform:scale(1.08);position:relative;z-index:1}
.rpe-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.rpe-read{font-weight:500;min-height:24px}
textarea{width:100%;min-height:84px;resize:vertical;font:400 16px/1.45 var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea::placeholder{color:var(--ink-2);opacity:.8}
select.fld{width:100%;min-height:50px;font:400 17px/1.3 var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.slotrow{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.slot{display:grid;gap:6px}
label.lbl{font:600 16px/1.3 var(--f-body)}
.msg{font-size:14px;min-height:20px;color:var(--ink-2)}
.msg.err{color:var(--z5);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.err{color:#FF8A80}}
:root[data-theme="dark"] .msg.err{color:#FF8A80}

/* listes programme */
.weekcard{display:grid;gap:0;padding:0;overflow:hidden}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 10px}
.weekhead h2{font-size:16px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row .th{width:48px;height:64px;border-radius:10px;overflow:hidden;background:var(--line)}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .t{min-width:0;display:grid;gap:3px}
.row .t b{font:600 16px/1.2 var(--f-body)}
.row .t span{font-size:13.5px;color:var(--ink-2)}
.row .st{font:600 12.5px/1 var(--f-body);padding:7px 10px;border-radius:999px;background:var(--bg);color:var(--ink-2);white-space:nowrap}
.row.next .st{background:var(--cta);color:var(--on-cta)}
.needs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.needchip{display:flex;align-items:center;gap:10px;background:var(--sage-soft);border-radius:14px;padding:8px 14px 8px 10px;font:600 14px/1.2 var(--f-body);color:var(--ink)}
.needimg{display:flex;align-items:flex-end;gap:4px}
.needimg img{height:46px;width:auto;display:block}
.row.hasneeds{grid-template-columns:48px minmax(0,1fr) auto auto;gap:12px}
.rowneeds{display:flex;align-items:center;gap:4px;margin-left:auto;padding-left:8px}
.stitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.readpill{font:600 12px/1 var(--f-body);padding:5px 9px;border-radius:999px;background:var(--sage-soft);color:var(--cta);white-space:nowrap}
.row.done{background:var(--sage-soft);box-shadow:inset 4px 0 0 var(--cta)}
.row.done .th{position:relative}
.row.done .th img{opacity:.9}
.row.done .th::after{content:"✓";position:absolute;right:3px;bottom:3px;width:22px;height:22px;border-radius:50%;background:var(--cta);color:var(--on-cta);font:700 13px/22px var(--f-body);text-align:center}
.row.done .t b{color:var(--cta)}
.row.done .st{background:var(--cta);color:var(--on-cta)}

/* accordéons */
details{border-top:1px solid var(--line);padding:2px 0}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font:600 17px/1.3 var(--f-body)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
.dbody{display:grid;gap:10px;padding:0 0 16px;color:var(--ink)}
.dbody ul{margin:0;padding-left:20px;display:grid;gap:6px}
.excuse{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.excuse b{font-weight:600}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.scale i{display:grid;place-items:center;min-height:30px;border-radius:6px;font:700 12px/1 var(--f-body);font-style:normal}
.scale i.z1{background:var(--z1);color:var(--on-z1)}.scale i.z2{background:var(--z2);color:var(--on-z2)}.scale i.z3{background:var(--z3);color:var(--on-z3)}.scale i.z4{background:var(--z4);color:var(--on-z4)}.scale i.z5{background:var(--z5);color:var(--on-z5)}

/* citation du pourquoi */
.why{display:grid;gap:6px}
.whyhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.whyedit{font:500 13px/1.2 var(--f-body);color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:4px 0 4px 8px}
.why q{font:500 19px/1.35 var(--f-body);quotes:"« " " »"}

/* feuilles */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;align-items:end;justify-items:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:90%;overflow:auto}
.cmp{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;height:110px;align-items:stretch}
.cmpcol{display:grid;grid-template-rows:1fr auto;gap:3px;min-width:0}
.cmpcol .bars{display:flex;align-items:flex-end;gap:1px}
.cmpcol .bars i{flex:1;border-radius:2px 2px 0 0;min-height:0}
.cmpcol span{font:500 9px/1 var(--f-body);text-align:center;color:var(--ink-2)}
.cmp .p,.cmpleg .p{background:var(--line)}
.cmp .c,.cmpleg .c{background:var(--cta)}
.cmpleg{display:flex;gap:14px;font:500 12px/1 var(--f-body);color:var(--ink-2)}
.cmpleg span{display:inline-flex;align-items:center;gap:6px}
.cmpleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sheet{position:relative}
.scrim.center{align-items:center;padding:20px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.scrim.center .sheet{border-radius:24px;max-width:400px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.scrim.center .xbtn{top:12px;right:12px}
.scrim.center h2{padding-right:34px}
.xbtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:20px;border:0;background:var(--bg);color:var(--ink);font:400 26px/1 var(--f-body);cursor:pointer;display:grid;place-items:center;padding:0}
.sheet .grip{width:42px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.timer{font:800 56px/1 var(--f-display);text-align:center;letter-spacing:-.02em}
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.daypick button{appearance:none;font:600 14px/1 var(--f-body);min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:0}
.daypick button[aria-pressed="true"]{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}

/* navigation basse */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tab{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:12px;text-decoration:none;color:var(--ink-2);font:600 12px/1.1 var(--f-body)}
.tab[aria-current="page"]{background:var(--sage-soft);color:var(--ink)}
.tab svg{display:block}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 14px/1.3 var(--f-body);padding:11px 18px;border-radius:999px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs[hidden]{display:none}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.brow{display:grid;gap:6px}
.brow div.l{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.obar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.obar i{height:6px;border-radius:3px;background:var(--line)}
.obar i.on{background:var(--cta)}
.foot{font-size:12.5px;color:var(--ink-2);text-align:center;padding:6px 0 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="view" aria-live="polite"></div>

function tipRefresh(){
  var td=iso(new Date());

function needKey(s){ return /chaise/i.test(s)?'chaise':(/serviette/i.test(s)?'serviette':'bouteille'); }
function needIcons(n,h){
  var nd=NEEDS[n]; if(!nd) return "";
  var o='';
  nd.forEach(function(s){ var k=needKey(s), c=k==='bouteille'?2:1; for(var i=0;i<c;i++) o+='<img src="'+NEED_IMG[k]+'" alt="" style="height:'+h+'px;width:auto;display:block">'; });
  return o;
}
function needsHtml(n){
  var nd=NEEDS[n]; if(!nd) return "";
  var chips=nd.map(function(s){ var k=needKey(s); return '<span class="needchip"><span class="needimg">'+needIcons2(k)+'</span><span>'+esc(s)+'</span></span>'; }).join('');
  return '<p class="small"><b>À préparer :</b> '+nd.join(" et ")+'. Sors-le la veille, ça enlève une excuse.</p><div class="needs">'+chips+'</div>';
}
function needIcons2(k){ var c=k==='bouteille'?2:1, o=''; for(var i=0;i<c;i++) o+='<img src="'+NEED_IMG[k]+'" alt="">'; return o; }
function nextSlot(){
  if(!S.plan||S.plan.length<2) return null;
  var t=dow(new Date()); if(S.plan.indexOf(t)>-1) return {today:true,name:FULL[t]};
  for(var k=1;k<=7;k++){ var d=(t+k)%7; if(S.plan.indexOf(d)>-1) return {today:false,name:FULL[d]}; }
  return null;
}
function weekStrip(){
  var ws=weekStart(new Date()), td=dow(new Date()), done={}, wd=0;
  Object.keys(S.logs).forEach(function(k){ done[S.logs[k].date]=true; });
  var h='<div class="week">';
  for(var i=0;i<7;i++){
    var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i), isDone=!!done[iso(d)]; if(isDone) wd++;
    var pl=S.plan&&S.plan.indexOf(i)>-1;
    h+='<div class="day'+(pl?' planned':'')+(i===td?' today':'')+(isDone?' done':'')+'"><small>'+DAYS[i]+'</small><b class="tnum">'+d.getDate()+'</b><span class="mk">'+(isDone?icon("check",12):(pl?'<span class="dot"></span>':''))+'</span></div>';
  }
  return {html:h+'</div>', done:wd};
}

function viewHome(){
  var done=doneCount(), next=nextN(), h=topbar(true)+'<p class="hello">'+hello()+'</p>';
  if(next===null){
    h+='<section class="hero"><p class="eyebrow">Programme terminé</p><h1>Mission accomplie</h1><p>Tu as fait tes 16 séances. Ce n’est pas une fin, c’est une mise à jour : ton corps est prêt pour de nouveaux défis.</p>'+progressBar()+'</section>'+finale();
  } else {
    var wk=weekOf(next);
    h+='<section class="hero"><p class="eyebrow">'+(done===0?'Ta première séance':'Semaine '+wk+' sur 8')+'</p>'+
      '<h1>Séance '+next+'</h1>'+
      '<div class="chips"><span class="chip">30 min</span><span class="chip">Renfo + cardio</span><span class="chip">'+(isRedo()?'Intensité soutenue':'Intensité modérée')+'</span></div>'+
      needsHtml(next)+
      '<a class="btn block" data-gate="1" data-gate-label="J’ai compris, commencer" href="#seance-'+next+'">'+icon("play",18)+(done===0?'Commencer':'Ouvrir la séance')+'</a>'+
      '<div class="stack">'+progressBar()+'<div class="prog-lbl"><span class="tnum">'+done+' sur 16 faites</span><span>2 séances par semaine</span></div></div></section>';
  }
  var why=""; for(var i=4;i>=0;i--){ if(S.why[i]&&S.why[i].trim()){ why=S.why[i].trim(); break; } }
  if(why) h+='<section class="card why"><div class="whyhead"><p class="eyebrow">Mon pourquoi</p><a class="whyedit" href="#pourquoi">Modifier</a></div><q>'+esc(why)+'</q></section>';
  else h+='<section class="card"><h2>Ton pourquoi</h2><p>Cinq questions pour trouver la vraie raison de reprendre. Elle t’aidera les jours sans envie.</p><a class="btn soft" href="#pourquoi">Écrire mon pourquoi</a></section>';
  var ls=lastDone();
  if(next!==null && ls && daysSince(ls)>=5){
    h+='<section class="card"><h2>Ça fait '+daysSince(ls)+' jours</h2><p>Manquer une séance peut arriver. Ne jamais en manquer deux d’affilée. Si c’est un imprévu, déplace ta séance. Si c’est la flemme, applique la règle des 5 minutes.</p><div class="nav2"><button class="btn soft" data-act="timer">5 minutes</button><a class="btn ghost" href="#seance-'+next+'">Ma séance</a></div></section>';
  }
  h+=installCard();
  if(done>=8 && next!==null) h+='<section class="card"><h2>À mi-parcours</h2><p>Retrouve la vidéo de mi-parcours et ton bilan renfo / cardio.</p><button class="btn soft" data-act="mid-open">Voir mon bilan</button></section>';
  var ws=weekStrip(), slot=nextSlot(), msg;

  else if(slot&&slot.today) msg='Aujourd’hui, c’est ton créneau.';
  else if(slot) msg='Prochain créneau : '+slot.name+'.';
  h+='<section class="card"><div class="top" style="justify-content:space-between"><h2>Cette semaine</h2><span class="muted small tnum">'+ws.done+' / 2 séances</span></div>'+ws.html+'<p class="small muted">'+msg+'</p><button class="link-btn" data-act="plan">'+((S.plan&&S.plan.length===2)?'Changer mes créneaux / ajouter à mon agenda':'Choisir mes 2 créneaux et les ajouter à mon agenda')+'</button>'+'</section>';
  if(next!==null) h+='<section class="card"><h2>Pas envie aujourd’hui ?</h2><p>Dis-toi : « Je fais juste 5 minutes. Si après ça je veux arrêter, j’arrête. » 5 minutes, c’est toujours mieux que rien.</p><button class="btn ghost" data-act="timer">Lancer 5 minutes</button></section>';
  h+='<p class="foot">Par Nico l’APA · Tous droits réservés</p>';
  return h;
}

function recap(){
  var r=0,c=0,sum=0,n=0;
  Object.keys(S.logs).forEach(function(k){ var l=S.logs[k]; if(l.pref==='renfo') r++; else c++; sum+=l.rpe; n++; });
  if(!n) return '';
  var avg=(sum/n).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}), av=sum/n;
  var verdict = r>c ? 'Tu as préféré la partie <b>renfo</b>. Le programme de renfo est fait pour toi : tonifier ton corps et renforcer ta posture.'
    : c>r ? 'Tu as préféré la partie <b>cardio</b>. Le programme de cardio est fait pour toi : plus d’endurance et d’énergie au quotidien.'

/* ---------- Export agenda ---------- */
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsFold(l){ var out=[],s=l; while(s.length>60){ out.push(s.slice(0,60)); s=" "+s.slice(60); } out.push(s); return out.join("\r\n"); }
function icsStamp(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"; }
function icsSessions(tm){
  var rem=[]; for(var i=1;i<=16;i++){ if(!S.logs[i]) rem.push(i); }
  if(!S.plan||S.plan.length<2||!rem.length) return [];
  var now=new Date(), out=[];
  for(var k=0;k<400&&rem.length;k++){
    var day=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k), w=dow(day);
    if(S.plan.indexOf(w)<0 || !/^\d{2}:\d{2}$/.test(tm[w]||"")) continue;
    var hm=tm[w].split(":"), dt=new Date(day.getFullYear(),day.getMonth(),day.getDate(),parseInt(hm[0],10),parseInt(hm[1],10));
    if(dt>now) out.push({n:rem.shift(),dt:dt});
  }
  return out;
}
function buildICS(tm){
  var ev=icsSessions(tm), now=new Date(), utc=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+"Z";
  var url=(EMBED&&/^https?:/.test(location.protocol))?location.origin+location.pathname:"";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Nico l'APA//Reveil musculaire//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  ev.forEach(function(e){
    var end=new Date(e.dt.getTime()+30*60000), nd=NEEDS[e.n]?(" À prévoir : "+NEEDS[e.n].join(" et ")+"."):"";
    L.push("BEGIN:VEVENT","UID:reveil-musculaire-s"+e.n+"-"+icsStamp(e.dt)+"@nico-l-apa","DTSTAMP:"+utc,"DTSTART:"+icsStamp(e.dt),"DTEND:"+icsStamp(end),
      "SUMMARY:"+icsEsc("Séance "+e.n+" · Réveil musculaire"),
      "DESCRIPTION:"+icsEsc("30 min, renfo et cardio, intensité modérée."+nd+" Ouvre l'application pour lancer la vidéo.")+(url?"":""));
    if(url) L.push("URL:"+url);
    L.push("BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P1D","DESCRIPTION:"+icsEsc("Demain : séance "+e.n+". Prépare tes affaires."),"END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT10M","DESCRIPTION:"+icsEsc("C'est l'heure de ta séance "+e.n),"END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}

function wrapLines(x,text,maxW){ var w=text.split(" "),lines=[],cur=""; w.forEach(function(s){ var tt=cur?cur+" "+s:s; if(x.measureText(tt).width>maxW&&cur){ lines.push(cur); cur=s; } else cur=tt; }); if(cur) lines.push(cur); return lines; }
function spaced(x,text,cx,y,sp){ var tw=0,i; for(i=0;i<text.length;i++) tw+=x.measureText(text[i]).width+sp; tw-=sp; var px=cx-tw/2; x.textAlign="left"; for(i=0;i<text.length;i++){ x.fillText(text[i],px,y); px+=x.measureText(text[i]).width+sp; } x.textAlign="center"; }
function drawDiploma(done){
  var W=1080,H=1920,r=0,c=0,sum=0,n=0;

function nextRdv(){

  if(weekStrip().done>=2){
    var first=Math.min.apply(null,S.plan); diff=7-t+first;

function missedCheck(){
  if(!S.onboarded||!S.plan||S.plan.length<2||!S.startDate||nextN()===null) return null;
  var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()), ws=weekStart(today);
  var found=[];
  for(var back=1;back>=0;back--){
    var w0=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()-7*back), w7=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+7), key=iso(w0), passed=0, done=0;
    S.plan.forEach(function(d){ var dd=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+d); if(dd<today && iso(dd)>S.startDate) passed++; });
    Object.keys(S.logs).forEach(function(k){ var ld=parseISO(S.logs[k].date); if(ld>=w0 && ld<w7) done++; });
    if(done<passed && S.missedShown.indexOf(key)===-1) found.push(key);
  }
  return found.length?found:null;
}

function popups(allowCarnet){

}

  openLayer('<p class="eyebrow">Échauffement terminé</p><h2>Bravo'+(nm()?' '+esc(nm()):'')+', tu as bougé</h2><p>Tu continues avec ta séance du jour'+(nx?' (séance '+nx+')':'')+' ?</p><button class="btn block" data-act="five-yes">Oui, je continue</button><button class="btn ghost block" data-act="five-no">Non, je m’arrête là</button>');
}
function timerSheet(){
  fiveSheet(); return;
  var end=Date.now()+300000;
  openLayer('<p class="eyebrow">Règle des 5 minutes</p><div class="timer tnum" id="tm">5:00</div><p class="muted" id="tmsg">Bouge pendant 5 minutes. Après, tu décides : tu continues ou tu t’arrêtes.</p><div class="nav2"><button class="btn ghost" data-act="close">Fermer</button><span></span></div>');
  ui.timer=setInterval(function(){
    var left=Math.max(0,Math.round((end-Date.now())/1000)), el=document.getElementById("tm");
    if(!el){ clearInterval(ui.timer); ui.timer=null; return; }
    el.textContent=Math.floor(left/60)+":"+pad(left%60);
    if(left===0){
      clearInterval(ui.timer); ui.timer=null;
      document.getElementById("tmsg").textContent="5 minutes de faites, c’est toujours mieux que rien. Tu continues ?";
      el.textContent="Bravo";
    }
  },250);
}

/* ---------- Rendu et routage ---------- */
function route(){
  var h=(location.hash||"").replace(/^#/,""), m=/^seance-(\d+)$/.exec(h);
  if(m) return {name:"seance",n:parseInt(m[1],10),tab:"programme"};
  var mt=/^conseils-([a-z0-9-]+)$/.exec(h);
  if(mt) return {name:"conseils",tab:"conseils",tip:mt[1]};
  if(h==="programme"||h==="pourquoi"||h==="conseils") return {name:h,tab:h};
  return {name:"accueil",tab:"accueil"};
}
function renderTabs(active){
  var T=[["accueil","Aujourd’hui","sun"],["programme","Programme","list"],["pourquoi","Pourquoi","target"],["conseils","Conseils","bulb"]], h='';
  T.forEach(function(t){ h+='<a class="tab" href="#'+t[0]+'"'+(t[0]===active?' aria-current="page"':'')+'>'+icon(t[2],24)+'<span>'+t[1]+'</span></a>'; });
  document.getElementById("tabs").innerHTML=h;
}
function render(){
  var r=route(), v=document.getElementById("view"), html;
  document.querySelector(".tabs").hidden=!S.onboarded;
  if(S.onboarded && r.name==="seance" && r.n===1 && !S.logs[1] && !S.started){ S.started=true; save(); }
  if(!S.onboarded){ v.innerHTML=viewOnboarding(); return; }
  if(r.name==="seance" && !S.agendaDone){ v.innerHTML=viewAgendaGate(r.n); renderTabs(r.tab); return; }
  if(r.name==="seance") html=viewSession(r.n);
  else if(r.name==="programme") html=viewProgramme();
  else if(r.name==="pourquoi") html=viewWhy();
  else if(r.name==="conseils") html=viewTips();
  else html=viewHome();
  v.innerHTML=html; renderTabs(r.tab);
  if(ui.autoStart && r.name==="seance" && r.n===ui.autoStart){ var asn=ui.autoStart; ui.autoStart=null; startAfterWarmup(asn); }
  if(r.name==="conseils" && r.tip){ setTimeout(function(){ var el=document.getElementById("tip-"+r.tip); if(el) el.scrollIntoView({block:"start"}); },60); }
}
document.addEventListener("change",function(e){
  var el=e.target; if(!el||!el.getAttribute||el.getAttribute("data-slot")===null) return;
  slotInit(); var k=parseInt(el.getAttribute("data-slot"),10), f=el.getAttribute("data-f");
  if(f==="d"){ ui.slots[k].d=el.value===""?null:parseInt(el.value,10); var s=ui.slots; if(s[0].d!==null&&s[1].d!==null&&s[0].d>s[1].d){ var tmp=s[0]; s[0]=s[1]; s[1]=tmp; } }
  else ui.slots[k].t=el.value;
  ui.icsDone=false; ui.gcal={}; ui.planDraft=ui.slots.filter(function(x){return x.d!==null;}).map(function(x){return x.d;});
  if(S.onboarded && slotsValid()){
    var nd=[ui.slots[0].d,ui.slots[1].d], od=(S.plan||[]).slice().sort(function(a,b){return a-b;});
    var tmn={}; tmn[nd[0]]=ui.slots[0].t; tmn[nd[1]]=ui.slots[1].t;
    if(od.join()!==nd.join()||JSON.stringify(S.slotTimes||{})!==JSON.stringify(tmn)){ S.plan=nd.slice(); S.slotTimes=tmn; S.icsTime=ui.slots[0].t; S.agendaDone=false; save(); }
  }
  if(document.querySelector("#layer .slot")) icsSheet(); else render();
});
window.addEventListener("hashchange",function(){ ui.qNext=false; ui.chain=[]; ui.editing=null; ui.draftN=null; ui.confirmReset=false; closeLayer(); render(); window.scrollTo(0,0); if(ui.celebrate){ var c=ui.celebrate; ui.celebrate=null; celebrate(c); } });

document.addEventListener("click",function(e){
  var g=e.target.closest("[data-gate]");
  if(g && !S.seenIntensity && S.onboarded){ e.preventDefault(); gateSheet(g.getAttribute("href"), g.getAttribute("target")==="_blank", g.getAttribute("data-gate-label")||"J’ai compris", g.getAttribute("data-yt")); return; }
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act"), v=b.getAttribute("data-v");
  if(a==="close-bg"){ if(e.target===b){ closeLayer(); chainNext(); } return; }
  if(a==="close"){ closeLayer(); chainNext(); return; }
  if(a==="tip-read"){ if(S.tipClickedOn!==iso(new Date())){ S.tipClickedOn=iso(new Date()); save(); } if(b.closest(".sheet")){ var th=b.getAttribute("href"); if(location.hash===th) closeLayer(); } return; }
  if(a==="go-carnet"){
    closeLayer(); if(location.hash!=="#seance-1") location.hash="#seance-1";
    setTimeout(function(){ var f=document.getElementById("logform"); if(f) f.scrollIntoView({behavior:"smooth",block:"start"}); },200); return;
  }
  if(a==="intensity-ok"){ S.seenIntensity=true; save(); var yid=b.getAttribute("data-yt"), ys=parseInt(b.getAttribute("data-start")||"0",10)||0; setTimeout(closeLayer,0); if(yid) playVideo(yid,ys); return; }
  if(a==="install"){ if(deferredInstall){ var dp=deferredInstall; deferredInstall=null; try{ dp.prompt(); dp.userChoice.then(function(){ render(); closeLayer(); }); }catch(e){} } return; }
  if(a==="install-help"){ openLayer('<h2>Installer l’application</h2><p class="muted">Elle s’ouvre alors en plein écran, sans barre d’adresse, avec sa propre icône.</p>'+installSteps()+'<button class="btn block" data-act="close">Fermer</button>'); return; }
  if(a==="install-dismiss"){ S.installDismissed=true; save(); render(); return; }
  if(a==="gcal"){
    var k=parseInt(v,10), im2=document.getElementById("icsmsg");
    if(!slotsValid()){ return; }
    var gu=gcalUrl(k); if(!gu) return;
    var dys2=[ui.slots[0].d,ui.slots[1].d], tm2={}; tm2[dys2[0]]=ui.slots[0].t; tm2[dys2[1]]=ui.slots[1].t;
    S.slotTimes=tm2; S.icsTime=ui.slots[0].t; ui.planDraft=dys2.slice();
    ui.gcal=ui.gcal||{}; ui.gcal[k]=true;
    if(ui.gcal[0]&&ui.gcal[1]){
      ui.icsDone=true;
      if(S.onboarded && !document.querySelector('[data-act="agenda-ok"]')) S.agendaDone=true;
    }
    save();
    try{ window.open(gu,"_blank","noopener"); }catch(e){}
    if(document.querySelector("#layer .slot")) icsSheet(); else render();
    return;
  }
  if(a==="ics-go"){
    var im=document.getElementById("icsmsg");
    if(!slotsValid()){ if(im){ im.className="msg err"; im.textContent="Choisis le jour et l’heure de tes deux séances."; } return; }
    var dys=[ui.slots[0].d,ui.slots[1].d], tmap={}; tmap[dys[0]]=ui.slots[0].t; tmap[dys[1]]=ui.slots[1].t;
    S.slotTimes=tmap; S.icsTime=ui.slots[0].t; ui.planDraft=dys.slice(); save();
    var savedPlan=S.plan; S.plan=dys.slice();
    try{
      saveBlob(new Blob([buildICS(tmap)],{type:"text/calendar;charset=utf-8"}),"reveil-musculaire.ics");
      ui.icsDone=true;
      if(im){ im.className="msg"; im.textContent="Fichier téléchargé. Ouvre-le pour ajouter les séances à ton agenda."; }
      var nx=document.querySelector('[data-act="onb-done"],[data-act="agenda-ok"]'); if(nx){ nx.disabled=false; nx.style.opacity=""; }
      if(S.onboarded && !document.querySelector('[data-act="agenda-ok"]')) S.agendaDone=true;
    }
    catch(e){ if(im){ im.className="msg err"; im.textContent="Le téléchargement n’a pas fonctionné sur cet appareil."; } }
    if(!S.onboarded) S.plan=savedPlan;
    save();
    return;
  }
  if(a==="diploma"){ closeLayer(); diplomaSheet(); return; }
  if(a==="dip-save"){ if(ui.dipBlob) saveBlob(ui.dipBlob,"diplome-reveil-musculaire.png"); return; }
  if(a==="dip-share"){ try{ navigator.share({files:[ui.dipFile],title:"Réveil musculaire à la maison",text:"J’ai terminé le programme Réveil musculaire à la maison !"}).catch(function(){}); }catch(e){} return; }
  if(a==="settings"){ ui.wipeConfirm=false; settingsSheet(); return; }
  if(a==="theme"){ S.theme=v; ui.themeTouched=true; save(); applyTheme(); settingsSheet(); return; }
  if(a==="wipe"){ ui.wipeConfirm=true; settingsSheet(); return; }
  if(a==="wipe-no"){ ui.wipeConfirm=false; settingsSheet(); return; }
  if(a==="wipe-yes"){
    S.slotTimes={}; ui.slots=null; ui.gcal={}; S.agendaDone=false; S.safetySeen=false; S.tipsRead={}; S.plan=null; S.logs={}; S.why=["","","","",""]; S.archive=[]; S.onboarded=false; S.seenIntensity=false; S.startDate=null; S.started=false; S.carnetTipSeen=false; S.missedShown=[]; S.tipIdx=0; S.tipClickedOn=null; S.midSeen=false; S.midTipShown=false; S.endSeen=false; S.name=""; S.round=1;
    save(); ui.wipeConfirm=false; ui.onbStep=0; ui.draftN=null; closeLayer(); location.hash="#accueil"; render(); window.scrollTo(0,0); return;
  }
  if(a==="end-open"){ ui.chain=[]; closeLayer(); endSheet(); return; }
  if(a==="mid-open"){ ui.chain=[]; closeLayer(); midSheet(); return; }
  if(a==="play-expl"){
    var box=b.closest(".evid"), yy=b.getAttribute("data-yt");
    if(box && /^[A-Za-z0-9_-]{11}$/.test(yy)) box.innerHTML='<div class="frame"><iframe src="https://www.youtube.com/embed/'+yy+'?autoplay=1&rel=0&playsinline=1&modestbranding=1'+ORG+'" title="Vidéo explicative" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
    return;
  }
  if(a==="play-video"){ playVideo(b.getAttribute("data-yt")); return; }
  if(a==="onb-next"){
    var any=S.why.some(function(x){return x&&x.trim();});
    if(!any){ var om=document.getElementById("onbmsg"); om.className="msg err"; om.textContent="Écris au moins ta première réponse."; return; }
    ui.onbStep=2; ui.planDraft=(S.plan||[]).slice(); render(); window.scrollTo(0,0); return;
  }
  if(a==="onb-name"){ var fn=document.getElementById("firstName"); S.name=(fn?fn.value:"").trim().slice(0,30); save(); ui.onbStep=1; render(); window.scrollTo(0,0); return; }
  if(a==="onb-back"){ ui.onbStep=Math.max(0,ui.onbStep-1); render(); window.scrollTo(0,0); return; }
  if(a==="agenda-ok"){
    if(!ui.icsDone) return;
    S.agendaDone=true; ui.slots=null; save(); var go=ui.gateTo; ui.gateTo=undefined; location.hash=go?("#seance-"+go):"#accueil"; render(); window.scrollTo(0,0); return;
  }
  if(a==="onb-done"){
    if(slotsValid() && ui.icsDone){ S.agendaDone=true; S.plan=[ui.slots[0].d,ui.slots[1].d]; ui.slots=null; S.onboarded=true; S.safetySeen=true; S.startDate=iso(new Date()); save(); location.hash="#accueil"; render(); window.scrollTo(0,0); toast("Tes deux créneaux sont fixés"); }
    return;
  }
  if(a==="five-done"){ fiveChoice(); return; }
  if(a==="five-yes"){ var fx=nextN(); closeLayer(); if(!fx){ location.hash="#accueil"; return; } ui.autoStart=fx; if(location.hash==="#seance-"+fx) render(); else location.hash="#seance-"+fx; return; }
  if(a==="five-no"){ openLayer('<p class="eyebrow">C’est bien</p><h2>'+(nm()?esc(nm())+', tu':'Tu')+' n’as pas cassé l’habitude</h2><p>5 minutes, c’est déjà une victoire : tu as bougé alors que tu n’en avais pas envie. C’est comme ça qu’on tient dans la durée.</p><button class="btn block" data-act="close">Fermer</button>'); return; }
  if(a==="timer"){ timerSheet(); return; }
  if(a==="plan"||a==="ics"){ ui.slots=null; ui.gcal={}; ui.icsDone=false; closeLayer(); icsSheet(); return; }
  if(a==="day"){
    var i=parseInt(v,10), d=ui.planDraft, k=d.indexOf(i);
    if(k>-1) d.splice(k,1); else { d.push(i); if(d.length>2) d.shift(); }
    d.sort(function(x,y){return x-y;}); ui.icsDone=false; if(!S.onboarded) render(); else renderPlan(); return;
  }
  if(a==="plan-save"){ if(ui.planDraft.length===2){ S.plan=ui.planDraft.slice(); ui.slots=null; S.agendaDone=false; ui.icsDone=false; save(); closeLayer(); render(); toast("Créneaux enregistrés. Mets-les à jour dans ton agenda avant ta prochaine séance."); } return; }
  if(a==="copy"){ copyText(v,b); return; }
  if(a==="pref"){ ui.draft.pref=v; render(); return; }
  if(a==="rpe"){ ui.draft.rpe=parseInt(v,10); render(); return; }
  if(a==="edit"){ ui.editing=route().n; render(); return; }
  if(a==="savelog"){
    var n=route().n, d=ui.draft, ta=document.getElementById("note"); if(ta) d.note=ta.value;
    if(!d.pref||d.rpe==null){ var m=document.getElementById("logmsg"); m.className="msg err"; m.textContent=!d.pref?"Choisis la partie que tu as préférée.":"Choisis l’intensité de ta séance."; return; }
    var prev=S.logs[n]; S.logs[n]={date:prev?prev.date:iso(new Date()),pref:d.pref,rpe:d.rpe,note:(d.note||"").trim()};
    save(); ui.editing=null; ui.draftN=null;
    if(prev){ render(); toast("Notes mises à jour"); window.scrollTo(0,0); }
    else { ui.celebrate={n:n,rpe:d.rpe}; location.hash="#accueil"; }
    return;
  }
  if(a==="reset"){ resetSheet(); return; }
  if(a==="reset-no"){ ui.confirmReset=false; render(); return; }
  if(a==="reset-yes"){
    S.archive.push({date:iso(new Date()),round:S.round||1,logs:S.logs}); S.round=(S.round||1)+1; S.logs={};
    S.slotTimes={}; ui.slots=null; ui.gcal={}; S.agendaDone=false; S.plan=null; S.onboarded=false; S.seenIntensity=false; S.startDate=null; S.started=false; S.carnetTipSeen=false; S.missedShown=[]; S.midSeen=false; S.midTipShown=false; S.endSeen=false;
    save(); ui.onbStep=0; ui.planDraft=[]; ui.draftN=null; ui.qNext=false; ui.confirmReset=false; closeLayer(); location.hash="#accueil"; render(); window.scrollTo(0,0); return;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="note"&&ui.draft){ ui.draft.note=t.value; }
  if(t.id==="setName"){ S.name=t.value.slice(0,30); save(); render(); }
  if(t.hasAttribute&&t.hasAttribute("data-why")){ S.why[parseInt(t.getAttribute("data-why"),10)]=t.value; save(); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeLayer(); });

document.documentElement.style.setProperty("--vr",VIDEO_RATIO);
applyTheme();
var startedBefore=S.started;
if(S.onboarded && !S.startDate){ S.startDate=iso(new Date()); save(); }
render();
setTimeout(function(){ popups(startedBefore); },400);
var hiddenAt=0;
function markAway(){ if(!hiddenAt) hiddenAt=Date.now(); }
function comeBack(){
  if(hiddenAt && Date.now()-hiddenAt>2000) ui.tipShown=false;
  hiddenAt=0;
  popups(true);
}
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden") markAway(); else comeBack(); });
window.addEventListener("pagehide",markAway);
window.addEventListener("pageshow",function(e){ if(e.persisted){ ui.tipShown=false; hiddenAt=0; popups(true); } });
window.addEventListener("blur",markAway);
window.addEventListener("focus",comeBack);
})();
